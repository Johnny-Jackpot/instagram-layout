<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram layout</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!--Layout-->
  <div class="app-container">
    <!--Sidebar-->
    <aside class="sidebar">
      <!--Logo-->
      <a href="#" class="brand-logo">
        <i class="ph-bold ph-instagram-logo"></i>
        <span>Instagram</span>
      </a>
      <!--Profile Card-->
      <div class="user-profile-card">
        <div class="user-avatar-wrapper">
          <img class="user-avatar" src="assets/images/main.png" alt="User Avatar" />
        </div>
        <h2 class="user-name">Shadow the Cat</h2>
        <span class="user-handle">@shadow_the_cat</span>
        <!--Stat row-->
        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-value">472</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">12.4k</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">534</span>
            <span class="stat-label">Following</span>
          </div>
        </div>
        <p class="user-bio">Best purr in the world</p>
      </div>
      <!--Story highlight-->
      <div class="highlights-section">
        <h3 class="highlights-title">Story highlights</h3>
        <div class="highlights-container">
          <div class="highlight-item">
            <div class="highlight-ring">
              <i class="ph ph-plus highlight-add"></i>
            </div>
            <span class="highlight-label">New</span>
          </div>
          <div class="highlight-item">
            <div class="highlight-ring">
              <img class="highlight-img" src="assets/images/cat_1.png" alt="Cat Image" />
            </div>
            <span class="highlight-label">Cats</span>
          </div>
          <div class="highlight-item">
            <div class="highlight-ring">
              <img class="highlight-img" src="assets/images/cat_2.png" alt="Cat Image" />
            </div>
            <span class="highlight-label">Another cats</span>
          </div>
          <div class="highlight-item">
            <div class="highlight-ring">
              <img class="highlight-img" src="assets/images/cat_3.png" alt="Cat Image" />
            </div>
            <span class="highlight-label">Awesome cats</span>
          </div>
          <div class="highlight-item">
            <div class="highlight-ring">
              <img class="highlight-img" src="assets/images/cat_4.png" alt="Cat Image" />
            </div>
            <span class="highlight-label">Cute cats</span>
          </div>
        </div>
      </div>
      <!--Sidebar nav-->
      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <i class="ph-fill ph-house"></i>
          <span>Feed</span>
        </a>
        <a href="#" class="nav-item">
          <i class="ph ph-compass"></i>
          <span>Explore</span>
        </a>
        <a href="#" class="nav-item">
          <i class="ph ph-film-strip"></i>
          <span>Reels</span>
        </a>
        <a href="#" class="nav-item">
          <i class="ph ph-gear"></i>
          <span>Setting</span>
        </a>
        <a href="#" class="nav-item">
          <i class="ph ph-sign-out"></i>
          <span>Logout</span>
        </a>
      </nav>
    </aside>
    <!--Main Content-->
    <main class="main-content">
      <div class="mobile-top-header">
        <button class="mobile-action-btn" id="mobileCreateBtn">
          <i class="ph-bold ph-plus"></i>
        </button>
        <div class="mobile-logo">Instagram</div>
        <button class="mobile-action-btn" id="mobileThemeToggleBtn">
          <i class="ph ph-moon" id="mobileThemeIcon"></i>
        </button>
      </div>

      <header class="top-header">
        <!--Search-->
        <div class="search-box">
          <i class="ph ph-magnifying-glass"></i>
          <input type="text" class="search-input" id="searchInput" placeholder="Search creators, photos, tags...">
        </div>
        <!--Actions-->
        <div class="header-actions">
          <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme">
            <i class="ph ph-moon" id="themeIcon"></i>
          </button>
          <button class="icon-btn" title="Notifications">
            <i class="ph ph-bell"></i>
            <span class="badge-dot"></span>
          </button>
          <button class="icon-btn" title="Direct Messages">
            <i class="ph ph-chat-circle-dots"></i>
          </button>
          <button class="btn-create-post" id="openCreatePostModal">
            <i class="ph ph-bold ph-plus"></i>
            <span>Create a post</span>
          </button>
        </div>
      </header>

      <section class="stories-section">
        <h2 class="section-title">Stories</h2>
        <div class="stories-flex">
          <!--Story card 1-->
          <div class="story-card">
            <div class="story-ring-container your-story">
              <img src="assets/images/main.png" class="story-avatar" alt="Your story">
              <div class="story-add-badge">
                <i class="ph-bold ph-plus"></i>
              </div>
            </div>
            <span class="story-username">Your story</span>
          </div>
          <!--Story card 2-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_3.png" class="story-avatar" alt="Cat Image">
              <span class="story-live-badge">LIVE</span>
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 3-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_4.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 4-->
          <div class="story-card">
            <div class="story-ring-container seen">
              <img src="assets/images/cat_2.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 5-->
          <div class="story-card">
            <div class="story-ring-container seen">
              <img src="assets/images/cat_1.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 6-->
          <div class="story-card">
            <div class="story-ring-container seen">
              <img src="assets/images/cat_3.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 7-->
          <div class="story-card">
            <div class="story-ring-container seen">
              <img src="assets/images/cat_4.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 8-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_1.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 9-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_2.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 10-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_3.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
          <!--Story card 11-->
          <div class="story-card">
            <div class="story-ring-container unseen">
              <img src="assets/images/cat_4.png" class="story-avatar" alt="Cat Image">
            </div>
            <span class="story-username">Cat</span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
