<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram layout</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!--Layout-->
  <div class="app-container">
    <!--Sidebar-->
    <aside class="sidebar">
      <!--Logo-->
      <a href="#" class="brand-logo">
        <i class="ph-bold ph-instagram-logo"></i>
        <span>Instagram</span>
      </a>
      <!--Profile Card-->
      <div class="user-profile-card">
        <div class="user-avatar-wrapper">
          <img class="user-avatar" src="assets/images/users/main.png" alt="User Avatar" />
        </div>
        <h2 class="user-name">Shadow the Cat</h2>
        <span class="user-handle">@shadow_the_cat</span>
        <!--Stat row-->
        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-value">472</span>
            <span class="stat-label">Posts</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">12.4k</span>
            <span class="stat-label">Followers</span>
          </div>
          <div class="stat-item">
            <span class="stat-value">534</span>
            <span class="stat-label">Following</span>
          </div>
        </div>
        <p class="user-bio">Best purr in the world</p>
      </div>
      <!--Story highlight-->
      <div class="highlights-section">
        <h3 class="highlights-title">Story highlights</h3>
        <div class="hightlights-container">
          <div class="highlights-item">
            <div class="highlights-ring">
              <i class="ph ph-plus highlight-add"></i>
            </div>
            <span class="highlight-label">New</span>
          </div>
        </div>
      </div>
    </aside>
    <!--Main Content-->
    <main class="main-content"></main>
  </div>
  <script src="assets/js/script.js"></script>
</body>
</html>
